[project]
name = "iac-llm-gen"
version = "0.1.0"
description = "Experimental: LLM-generated Terraform (Anthropic Claude) gated by `terraform validate`."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",   # Claude client (the only runtime dependency)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
iacgen = "iacgen.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["iacgen"]
